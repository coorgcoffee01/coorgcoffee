<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Coorg Coffee</title>
  <style>
    body {
      background-color: #12100E;
      color: #E8D9C5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .container {
      max-width: 440px;
    }
    h1 {
      font-size: 6rem;
      margin: 0;
      color: #C89B3C;
      font-weight: 800;
      line-height: 1;
    }
    h2 {
      font-size: 1.5rem;
      margin: 1rem 0 0.5rem;
      color: #FFFFFF;
      font-weight: 700;
    }
    p {
      color: #8E7E6E;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 2rem;
    }
    a {
      display: inline-block;
      background: #C89B3C;
      color: #000000;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    a:hover {
      background: #b08732;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you requested does not exist or has been removed.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
